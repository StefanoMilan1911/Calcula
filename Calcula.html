<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cartellino — Gestione Turni</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

:root{
  --ink:#1C2B39;
  --ink-soft:#5C6B72;
  --paper:#EEF1EF;
  --paper-raised:#FFFFFF;
  --line:#CBD3CF;
  --amber:#D98E3D;
  --amber-soft:#F3DBB6;
  --teal:#3E7C6B;
  --teal-soft:#CFE3DC;
  --rust:#B85450;
  --rust-soft:#EBD1CF;
  --radius:10px;
  font-size:16px;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans', system-ui, sans-serif;
  min-height:100vh;
  padding:24px 16px 64px;
}
.app{
  max-width:760px;
  margin:0 auto;
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px;
  flex-wrap:wrap;
}
.brand{
  display:flex;
  align-items:baseline;
  gap:10px;
}
.brand h1{
  font-family:'Space Grotesk', sans-serif;
  font-size:1.5rem;
  font-weight:700;
  margin:0;
  letter-spacing:-0.01em;
}
.brand .tag{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.72rem;
  color:var(--ink-soft);
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:999px;
  padding:2px 10px;
}
.month-nav{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:999px;
  padding:6px 8px;
}
.month-nav button{
  width:32px;height:32px;
  border-radius:50%;
  border:none;
  background:transparent;
  color:var(--ink);
  font-size:1.1rem;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.month-nav button:hover{background:var(--paper);}
.month-nav .label{
  font-family:'Space Grotesk', sans-serif;
  font-weight:600;

  text-align:center;
  text-transform:capitalize;
}
.icon-btn{

  background:var(--paper-raised);
  border-radius:10px;
  padding:9px 10px;
  cursor:pointer;
  font-family:'IBM Plex Sans', sans-serif;

}
.icon-btn:hover{border-color:var(--ink-soft);}

.panel-buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:16px;
}

/* legend */
.legend{

}
.chip{

}
.calendar-note{

  color:var(--ink-soft);
  margin:0 0 14px 2px;
  display:flex;
  align-items:center;
}
.calendar-note .holiday-dot{margin-left:0; margin-right:6px;}

/* calendar */
.calendar-card{
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
}
.calendar-card-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  gap:8px;
  flex-wrap:wrap;
}
.calendar-card-title{

  font-weight:600;
  font-size:0.9rem;
  color:var(--ink-soft);

}
.edit-toggle{

  background:var(--paper);
  border-radius:999px;

.edit-toggle.active{

}
.weekdays{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
  margin-bottom:6px;
}
.weekdays span{

  font-family:'IBM Plex Mono', monospace;
  font-size:0.76rem;
  color:var(--ink-soft);

  letter-spacing:0.05em;
}
.days{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}
.day{
  min-height:100px;

  border:1px solid var(--line);

.day.empty{border:none;background:transparent;min-height:0;}
.day .num{

.day.today .num{color:var(--amber); font-weight:700;}
.day-shifts-fill{
  flex:1;

  flex-direction:row;
  border-radius:5px;
  overflow:hidden;

}
.shift-block{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-family:'IBM Plex Mono', monospace;
  font-weight:700;
  font-size:0.78rem;
  text-transform:uppercase;
  text-align:center;
  cursor:pointer;
  letter-spacing:0.01em;
  white-space:nowrap;

  padding:0 1px;
}
.day-shifts-fill.readonly .shift-block{cursor:default;}
.shift-block:not(:last-child){

}
.add-shift{

  border-radius:5px;
  padding:2px 2px;

}
.add-shift:focus{outline:2px solid var(--amber); outline-offset:1px;}
.holiday-dot{
  display:inline-block;
  width:5px;height:5px;
  border-radius:50%;

  margin-left:3px;

@media (max-width:480px){

.type-row{

.type-row input[type=color]{

.type-row input[type=text],.type-row input[type=number]{

<script>
const STORAGE_TYPES_KEY = 'shift-types';
const STORAGE_PAY_KEY = 'pay-config';
const STORAGE_LASTBACKUP_KEY = 'last-backup-at';
const STORAGE_FIRSTUSE_KEY = 'first-use-at';
const STORAGE_SNOOZE_KEY = 'backup-snooze-until';
const STORAGE_DARKMODE_KEY = 'dark-mode';
const STORAGE_AUTH_KEY = 'fake-auth-user';
const BACKUP_REMINDER_DAYS = 30;
const SNOOZE_DAYS = 7;
const monthKey = (y,m)=>`month-${y}-${String(m+1).padStart(2,'0')}`;

const MULT_LEGEND = [
  {value:11.08921, label:'straordinari'},
  {value:12.39, label:'notte'},
  {value:58.82615, label:'ferie'},
  {value:1.44642, label:'domenica e festivi'},
  {value:9.26958, label:'festivi'},
];

const DEFAULT_TYPES = [
  {id:'M', code:'M', label:'Mattino', hours:6, color:'#3E7C6B'},
  {id:'P', code:'P', label:'Pomeriggio', hours:6, color:'#D98E3D'},
  {id:'PP', code:'P+', label:'Pomeriggio esteso', hours:8, color:'#B85450'},
  {id:'N', code:'N', label:'Notte', hours:8, color:'#5C7FA6'},
  {id:'R', code:'R', label:'Riposo', hours:0, color:'#8B9A96'},
  {id:'F', code:'F', label:'Ferie', hours:0, color:'#8B9A96'},
];
function defaultPay(){
  return {
    hourlyRate: 10,
    multipliers: {
      overtime: {m1:null, m2:null, useM2:false},
      holiday: {m1:null, m2:null, useM2:false},
      sunday: {m1:null, m2:null, useM2:false},
      night: {m1:null, m2:null, useM2:false},
      vacation: {m1:null, m2:null, useM2:false},
    }
  };
}

let types = DEFAULT_TYPES;
let pay = defaultPay();
let today = new Date();
let viewY = today.getFullYear();
let viewM = today.getMonth();
let monthData = {shifts:{}, net:null, extra:{}, overtimeThreshold:null};
let editMode = false;
let authUser = null;
let openEarningsSections = new Set();
let activePanel = null; // 'settings' | 'stats' | 'earnings' | null
let darkMode = false;
let openSuggestionKeys = new Set();

const ITALIAN_MONTHS = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const ITALIAN_MONTHS_SHORT = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const ITALIAN_WEEKDAYS = ['L','M','M','G','V','S','D'];

function getEasterDate(year){
  const a = year % 19;
  const b = Math.floor(year/100);
  const c = year % 100;
  const d = Math.floor(b/4);
  const e = b % 4;
  const f = Math.floor((b+8)/25);
  const g = Math.floor((b-f+1)/3);
  const h = (19*a+b-d-g+15)%30;
  const i = Math.floor(c/4);
  const k = c%4;
  const l = (32+2*e+2*i-h-k)%7;
  const m = Math.floor((a+11*h+22*l)/451);
  const month = Math.floor((h+l-7*m+114)/31);
  const day = ((h+l-7*m+114)%31)+1;
  return new Date(year, month-1, day);
}
const holidaySetCache = {};
function getHolidaySet(year){
  if(holidaySetCache[year]) return holidaySetCache[year];
  const set = {};
  const add=(m,d,name)=>{ set[`${m}-${d}`]=name; };
  add(0,1,'Capodanno');
  add(0,6,'Epifania');
  add(3,25,'Festa della Liberazione');
  add(4,1,'Festa dei Lavoratori');
  add(5,2,'Festa della Repubblica');
  add(7,15,'Ferragosto');
  add(10,1,'Ognissanti');
  add(11,8,'Immacolata Concezione');
  add(11,25,'Natale');
  add(11,26,'Santo Stefano');
  const easter = getEasterDate(year);
  const easterMonday = new Date(easter.getFullYear(), easter.getMonth(), easter.getDate()+1);
  set[`${easterMonday.getMonth()}-${easterMonday.getDate()}`] = 'Pasquetta';
  holidaySetCache[year] = set;
  return set;
}
function getHolidayName(y,m,d){
  return getHolidaySet(y)[`${m}-${d}`] || null;
}

async function loadSettings(){
  try{
    const t = localStorage.getItem(STORAGE_TYPES_KEY);
    if(t) types = JSON.parse(t);
  }catch(e){}
  pay = defaultPay();
  try{
    const p = localStorage.getItem(STORAGE_PAY_KEY);
    if(p){
      const parsed = JSON.parse(p);
      if(parsed.hourlyRate!==undefined) pay.hourlyRate = parsed.hourlyRate;
      if(parsed.multipliers){
        Object.keys(pay.multipliers).forEach(k=>{
          if(parsed.multipliers[k]) pay.multipliers[k] = {...pay.multipliers[k], ...parsed.multipliers[k]};
        });
      }
    }
  }catch(e){}
  try{
    darkMode = localStorage.getItem(STORAGE_DARKMODE_KEY) === '1';
  }catch(e){ darkMode = false; }
  applyDarkModeClass();
  try{
    const a = localStorage.getItem(STORAGE_AUTH_KEY);
    authUser = a ? JSON.parse(a) : null;
  }catch(e){ authUser = null; }
}
function applyDarkModeClass(){
  document.body.classList.toggle('dark', darkMode);
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', darkMode ? '#12181F' : '#1C2B39');
}
async function saveSettings(){
  try{
    localStorage.setItem(STORAGE_TYPES_KEY, JSON.stringify(types));
    localStorage.setItem(STORAGE_PAY_KEY, JSON.stringify(pay));
  }catch(e){ console.error('Errore salvataggio impostazioni', e); }
}

function normalizeMonthData(parsed){
  if(parsed && typeof parsed==='object' && parsed.shifts){
    const shifts = {};
    Object.entries(parsed.shifts).forEach(([d,v])=>{ shifts[d] = Array.isArray(v)?v:[v]; });
    const extra = {};
    if(parsed.extra) Object.entries(parsed.extra).forEach(([d,v])=>{ extra[d] = Number(v); });
    return {shifts, net: (parsed.net===undefined?null:parsed.net), extra, overtimeThreshold: (parsed.overtimeThreshold===undefined?null:parsed.overtimeThreshold)};
  }
  if(parsed && typeof parsed==='object'){
    const shifts = {};
    Object.entries(parsed).forEach(([d,v])=>{ shifts[d] = Array.isArray(v)?v:[v]; });
    return {shifts, net:null, extra:{}, overtimeThreshold:null};
  }
  return {shifts:{}, net:null, extra:{}, overtimeThreshold:null};
}

async function loadMonth(y,m){
  try{
    const r = localStorage.getItem(monthKey(y,m));
    monthData = r ? normalizeMonthData(JSON.parse(r)) : {shifts:{}, net:null, extra:{}, overtimeThreshold:null};
  }catch(e){ monthData = {shifts:{}, net:null, extra:{}, overtimeThreshold:null}; }
}
async function saveMonth(y,m){
  try{
    localStorage.setItem(monthKey(y,m), JSON.stringify(monthData));
  }catch(e){ console.error('Errore salvataggio turni del mese', e); }
}

function exportBackup(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k===STORAGE_TYPES_KEY || k===STORAGE_PAY_KEY || k.startsWith('month-')){
      data[k] = localStorage.getItem(k);
    }
  }
  const jsonStr = JSON.stringify(data, null, 2);

  if(window.ExportBackup){
    // Dentro l'app Flutter: manda il contenuto al lato nativo, che lo condivide/salva.
    const b64 = btoa(encodeURIComponent(jsonStr).replace(/%([0-9A-F]{2})/g, (m,p1)=>String.fromCharCode('0x'+p1)));
    window.ExportBackup.postMessage(b64);
  } else {
    // Browser normale: scarica come file, come sempre.
    const blob = new Blob([jsonStr], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'cartellino-backup.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  localStorage.setItem(STORAGE_LASTBACKUP_KEY, new Date().toISOString());
  localStorage.removeItem(STORAGE_SNOOZE_KEY);
  render();
}
window.exportBackup = exportBackup;

function daysSince(dateStr){
  return (Date.now() - new Date(dateStr).getTime()) / (1000*60*60*24);
}
function shouldShowBackupReminder(){
  const snooze = localStorage.getItem(STORAGE_SNOOZE_KEY);
  if(snooze && new Date(snooze).getTime() > Date.now()) return false;
  const last = localStorage.getItem(STORAGE_LASTBACKUP_KEY) || localStorage.getItem(STORAGE_FIRSTUSE_KEY);
  if(!last) return false;
  return daysSince(last) >= BACKUP_REMINDER_DAYS;
}
window.snoozeBackup = function(){
  const d = new Date(Date.now() + SNOOZE_DAYS*24*60*60*1000);
  localStorage.setItem(STORAGE_SNOOZE_KEY, d.toISOString());
  render();
};

function importBackup(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(e){
    try{
      const data = JSON.parse(e.target.result);
      Object.entries(data).forEach(([k,v])=>localStorage.setItem(k,v));
      await loadSettings();
      await loadMonth(viewY, viewM);
      alert('Backup importato con successo.');
      closePanel();
      render();
    }catch(err){
      alert('File di backup non valido.');
    }
  };
  reader.readAsText(file);
}
window.importBackup = importBackup;

function typeById(id){ return types.find(t=>t.id===id); }

function calcMultiplied(qty, cfg){
  if(!cfg) return 0;
  const m1 = Number(cfg.m1)||0;
  let total = qty * m1;
  if(cfg.useM2){
    const m2 = Number(cfg.m2)||0;
    total += qty * m2;
  }
  return total;
}

function computeSummary(){
  let normalHours = 0;
  let holidayHours = 0, sundayHours = 0;
  let vacationDays = new Set();
  let nightDays = new Set();

  Object.entries(monthData.shifts).forEach(([day,list])=>{
    const d = Number(day);
    const isSunday = new Date(viewY, viewM, d).getDay()===0;
    const holidayName = getHolidayName(viewY, viewM, d);
    const isHoliday = !!holidayName;

    list.forEach(id=>{
      const t = typeById(id);
      if(!t) return;
      const hrs = Number(t.hours)||0;
      const code = (t.code||'').trim().toUpperCase();

      if(code==='N') nightDays.add(day);

      if(code==='F'){
        vacationDays.add(day);
        return; // solo giorno, non ore/soldi
      }
      if(isHoliday){ holidayHours += hrs; return; }
      if(isSunday){ sundayHours += hrs; return; }
      normalHours += hrs;
    });
  });

  const ordinaryHours = normalHours + sundayHours; // usate per il lordo stimato
  const totalHours = normalHours + sundayHours + holidayHours; // tutte le ore lavorate
  const gross = ordinaryHours * (Number(pay.hourlyRate)||0);

  return {
    totalHours, ordinaryHours, gross,
    holidayHours, sundayHours,
    vacationDays: vacationDays.size, nightDays: nightDays.size,
    net: monthData.net
  };
}

function fmtEuro(n){
  if(n===null || n===undefined || n==='') return '—';
  return Number(n).toLocaleString('it-IT', {style:'currency', currency:'EUR'});
}
function fmtHours(n){
  return Number(n).toLocaleString('it-IT', {maximumFractionDigits:1});
}

function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
function firstWeekdayMon0(y,m){
  const d = new Date(y,m,1).getDay();
  return (d+6)%7;
}

function hexToSoftBg(hex){
  const c = hex.replace('#','');
  const r = parseInt(c.substring(0,2),16), g = parseInt(c.substring(2,4),16), b = parseInt(c.substring(4,6),16);
  return `rgba(${r},${g},${b},0.18)`;
}

function renderAnnualNetChart(){
  const year = viewY;
  const nets = [];
  for(let m=0;m<12;m++){ nets.push(getStoredNet(year,m)); }
  const present = nets.filter(v=>v!==null && v!==undefined);
  const maxNet = Math.max(1, ...present.map(Number));
  const bars = nets.map((v,m)=>{
    const hasVal = v!==null && v!==undefined;
    const h = hasVal ? Math.max(4, Math.round((Number(v)/maxNet)*100)) : 2;
    const isCur = m===viewM;
    return `<div class="year-bar-col ${isCur?'current':''}" title="${ITALIAN_MONTHS_SHORT[m]}: ${hasVal?fmtEuro(v):'non inserito'}">
      <div class="year-bar" style="height:${h}%;"></div>
      <span class="year-bar-label">${ITALIAN_MONTHS_SHORT[m]}</span>
    </div>`;
  }).join('');
  return `<div class="year-bars">${bars}</div>`;
}
function getStoredNet(y,m){
  try{
    const r = localStorage.getItem(monthKey(y,m));
    if(!r) return null;
    const p = normalizeMonthData(JSON.parse(r));
    return p.net===undefined?null:p.net;
  }catch(e){ return null; }
}

function calcOvertimeHours(threshold, ordinaryHours){
  if(threshold===null || threshold===undefined || threshold==='') return 0;
  return Math.max(0, ordinaryHours - Number(threshold));
}

function renderEarningsPanel(summary){
  const threshold = monthData.overtimeThreshold;
  const overtimeHours = calcOvertimeHours(threshold, summary.ordinaryHours);
  const overtimeAmount = calcMultiplied(overtimeHours, pay.multipliers.overtime);
  const overtimeBaseAlreadyInGross = overtimeHours * (Number(pay.hourlyRate)||0);
  const holidayAmount = calcMultiplied(summary.holidayHours, pay.multipliers.holiday);
  const sundayAmount = calcMultiplied(summary.sundayHours, pay.multipliers.sunday);
  const nightAmount = calcMultiplied(summary.nightDays, pay.multipliers.night);
  const vacationAmount = calcMultiplied(summary.vacationDays, pay.multipliers.vacation);
  // Le ore di straordinario sono gia' incluse (a tariffa normale) dentro "gross":
  // le sottraiamo una volta a tariffa normale e le riaggiungiamo alla tariffa straordinaria,
  // cosi' non vengono pagate due volte.
  const grandTotal = summary.gross - overtimeBaseAlreadyInGross + overtimeAmount + holidayAmount + sundayAmount + nightAmount + vacationAmount;

  return `
    <h2>Guadagni — ${ITALIAN_MONTHS[viewM]} ${viewY}</h2>
    <div class="section-label">Riepilogo mese</div>
    <div class="special-row"><span>Ore totali</span><span>${fmtHours(summary.totalHours)} h</span></div>
    <div class="special-row"><span>Lordo (ore ordinarie)</span><span>${fmtEuro(summary.gross)}</span></div>
    <div class="special-row" style="color:var(--ink-soft); font-size:0.72rem; padding-top:0;">+ straordinari / festivi / domenicali / notte / ferie (dettaglio sotto)</div>
    <div class="mult-total" style="font-size:1rem; margin-top:10px;"><span>Totale mese stimato</span><span>${fmtEuro(grandTotal)}</span></div>
    <div style="margin:16px 0 20px;">
      <div class="section-label" style="margin:0 0 6px;">Netto reale del mese</div>
      <input type="number" step="0.01" class="net-input-light" id="netInput" placeholder="Inserisci l'importo" value="${summary.net===null||summary.net===undefined?'':summary.net}" onchange="onNetChange(event)">
    </div>
    ${renderOvertimeBlock(summary)}
    ${renderMultBlock('holiday','Festivi', summary.holidayHours, 'Ore', 'h')}
    ${renderMultBlock('sunday','Domenicali', summary.sundayHours, 'Ore', 'h')}
    ${renderMultBlock('night','Notte', summary.nightDays, 'Giorni', 'gg')}
    ${renderMultBlock('vacation','Ferie', summary.vacationDays, 'Giorni', 'gg')}
  `;
}

      <button class="icon-btn" onclick="openPanel('stats')">📈 Statistiche</button>

      </div>
    </div>` : ''}
  `;
}

window.addShift = async function(e){
  const day = Number(e.target.dataset.day);
  const val = e.target.value;
  if(!val) return;
  if(!monthData.shifts[day]) monthData.shifts[day] = [];
  monthData.shifts[day].push(val);
  await saveMonth(viewY, viewM);
  render();
};

window.removeShift = async function(day, idx){
  if(!editMode) return;
  if(monthData.shifts[day]){
    monthData.shifts[day].splice(idx,1);
    if(monthData.shifts[day].length===0) delete monthData.shifts[day];
  }
  await saveMonth(viewY, viewM);
  render();
};

window.toggleEditMode = function(){
  editMode = !editMode;
  render();
};

window.onNetChange = async function(e){
  const v = e.target.value;
  monthData.net = (v===''? null : Number(v));
  await saveMonth(viewY, viewM);
  render();
};

window.onMultChange = async function(e){
  const cat = e.target.dataset.cat;
  const field = e.target.dataset.field;
  const v = e.target.value;
  pay.multipliers[cat][field] = v===''?null:Number(v);
  await saveSettings();
  render();
};
window.onMultToggle = async function(e){
  const cat = e.target.dataset.cat;
  pay.multipliers[cat].useM2 = e.target.checked;
  await saveSettings();
  render();
};
window.setMult = async function(cat, field, val){
  pay.multipliers[cat][field] = val;
  await saveSettings();
  render();
};

window.toggleSuggestions = function(key){
  if(openSuggestionKeys.has(key)) openSuggestionKeys.delete(key); else openSuggestionKeys.add(key);
  render();
};

window.toggleEarningsSection = function(key){
  if(openEarningsSections.has(key)) openEarningsSections.delete(key); else openEarningsSections.add(key);
  render();
};

window.onThresholdChange = async function(e){
  const v = e.target.value;
  monthData.overtimeThreshold = v===''?null:Number(v);
  await saveMonth(viewY, viewM);
  render();
};
window.setThreshold = async function(val){
  monthData.overtimeThreshold = val;
  await saveMonth(viewY, viewM);
  render();
};

window.toggleDarkMode = async function(e){
  darkMode = e.target.checked;
  try{ localStorage.setItem(STORAGE_DARKMODE_KEY, darkMode ? '1' : '0'); }catch(err){}
  applyDarkModeClass();
};

window.changeMonth = async function(delta){
  viewM += delta;
  if(viewM<0){ viewM=11; viewY--; }
  if(viewM>11){ viewM=0; viewY++; }
  await loadMonth(viewY, viewM);
  render();
};

window.openPanel = function(name){
  activePanel = name;
  render();
};
window.closePanel = function(){
  activePanel = null;
  render();
};

let draftTypes = null;
window.updateType = function(idx, field, value){
  if(!draftTypes) draftTypes = JSON.parse(JSON.stringify(types));
  draftTypes[idx][field] = (field==='hours') ? Number(value) : value;
};
window.addType = function(){
  if(!draftTypes) draftTypes = JSON.parse(JSON.stringify(types));
  draftTypes.push({id:'T'+Date.now(), code:'', label:'', hours:0, color:'#5C7FA6'});
  types = draftTypes;
  render();
};
window.removeType = function(idx){
  if(!draftTypes) draftTypes = JSON.parse(JSON.stringify(types));
  draftTypes.splice(idx,1);
  types = draftTypes;
  render();
};

window.applySettings = async function(){
  if(draftTypes) types = draftTypes;
  pay.hourlyRate = Number(document.getElementById('hourlyRate').value)||0;
  draftTypes = null;
  await saveSettings();
  closePanel();
  render();
};

(async function init(){
  if(!localStorage.getItem(STORAGE_FIRSTUSE_KEY)){
    localStorage.setItem(STORAGE_FIRSTUSE_KEY, new Date().toISOString());
  }
  await loadSettings();
  await loadMonth(viewY, viewM);
  render();
})();
</script>
</body>
</html>
